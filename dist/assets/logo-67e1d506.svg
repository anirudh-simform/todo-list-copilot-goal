<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
  <!-- Background circle for visual prominence -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Focus frame (inner rectangle representing concentration) -->
  <rect x="14" y="14" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Checkmark (task completion) -->
  <path d="M 24 32 L 28 36 L 38 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dot representing focus point -->
  <circle cx="42" cy="20" r="2" fill="currentColor"/>
</svg>
